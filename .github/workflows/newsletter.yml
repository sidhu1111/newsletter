name: Daily Market Newsletter

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Generate newsletter
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python daily_newsletter.py

      - name: Publish to GitHub Pages
        run: |
          mkdir -p docs/archive/$(date +%Y-%m-%d)
          for f in index.html stocks.html market-news.html global-macro.html sectors.html sports.html; do
            [ -f "$f" ] && cp "$f" docs/ && cp "$f" docs/archive/$(date +%Y-%m-%d)/
          done

      - name: Commit and push
        run: |
          git config user.name "Newsletter Bot"
          git config user.email "bot@newsletter.local"
          git add docs/
          git diff --staged --quiet || git commit -m "Market Pulse $(date +%Y-%m-%d)"
          git push
